<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automation Hub</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Automation Hub</h1>
      <p class="subtitle">Monitor and control your local automations from one place.</p>
    </div>
    <nav class="nav">
      <a href="/" class="nav-link active">Dashboard</a>
      <a href="/whatsapp-guard.html" class="nav-link">WhatsApp Guard</a>
      <a href="/placeholder.html" class="nav-link">Automation 2</a>
    </nav>
  </header>

  <main class="container">
    <section class="summary-grid" id="summaryGrid">
      <div class="summary-card">
        <span class="summary-label">Running</span>
        <strong id="countRunning">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Paused</span>
        <strong id="countPaused">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Stopped</span>
        <strong id="countStopped">0</strong>
      </div>
      <div class="summary-card">
        <span class="summary-label">Coming soon</span>
        <strong id="countUnavailable">0</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Automations</h2>
        <button id="refreshBtn" class="btn secondary">Refresh</button>
      </div>
      <div id="automationList" class="automation-list"></div>
    </section>
  </main>

  <script src="/js/hub.js"></script>
  <script>
    initHubPage({ mode: 'dashboard' });
  </script>
</body>
</html>
